name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Tests with Maven
        run: mvn clean test

      - name: Upload Test Reports and Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-and-evidence
          path: |
            target/
            evidence/
          retention-days: 30